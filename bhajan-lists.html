<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhajan Lists — Muruga Sharanam</title>
  <meta name="description" content="Bhajan lists">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0 auto;
      max-width: 46rem;
      padding: 1.5rem;
      line-height: 1.6;
    }
     .header-row {
       display: flex;
       justify-content: space-between;
       align-items: center;
       gap: 0.5rem;
       margin-bottom: 0.5rem;
     }
     h1 {
       margin: 0;
       text-align: center;
     }
     .home-link {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: #b45309;
      border: 1px solid #b45309;
      border-radius: 6px;
      padding: 0.2rem 0.6rem;
      white-space: nowrap;
      margin-bottom: 0.25rem;
    }
     .home-link:hover {
       background: #b45309;
       color: #fff;
     }
     .create-list-btn {
       text-decoration: none;
       display: inline-block;
       font-size: 0.85rem;
       font-weight: 600;
       color: #fff;
       background: #b45309;
       border: 1px solid #b45309;
       border-radius: 6px;
       padding: 0.35rem 0.75rem;
       white-space: nowrap;
       cursor: pointer;
     }
     .create-list-btn:hover {
       background: #9a3412;
       color: #fff;
     }
     .empty-state {
      color: #999;
      font-style: italic;
      margin-top: 2rem;
      text-align: center;
    }
    .list-card {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: box-shadow 0.15s;
    }
    .list-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .list-card-title {
      font-weight: 600;
      color: #b45309;
      font-size: 1.1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .list-card-title:hover {
      text-decoration: underline;
    }
    .list-card-meta {
      color: #888;
      font-size: 0.8rem;
    }
    .list-card-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .list-card-count {
      background: #f0f0f0;
      border-radius: 12px;
      padding: 0.15rem 0.5rem;
      font-size: 0.75rem;
      color: #666;
    }
    .btn-delete {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #999;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
    }
    .btn-delete:hover {
      background: #ff4444;
      color: #fff;
      border-color: #ff4444;
    }
    .btn-clear-all {
      padding: 0.4rem 1rem;
      background: #b45309;
      color: #fff;
      border: 1px solid #b45309;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-clear-all:hover {
      background: #9a3412;
    }
    .header-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }
    .meta { color: #888; font-size: 0.9rem; margin-top: 0.15rem; }
    .close {
      border: none;
      background: #f0f0f0;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .close:hover { background: #e0e0e0; }
    .selection-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
    }
    .selection-overlay.hidden { display: none; }
    .selection-modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 42rem;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .selection-modal-header {
      flex-shrink: 0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #eee;
      padding: 1rem 1.5rem;
    }
    .selection-modal-header h2 { margin: 0; font-size: 1.2rem; }
    .selection-modal-header .selection-modal-header-name { flex: 1; }
    .selection-modal-header label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .selection-modal-header input {
      width: 100%;
      padding: 0.4rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
    }
    .selection-modal-body h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
    }
    .selection-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem 2rem;
    }
    .select-all-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .select-all-row button {
      padding: 0.4rem 0.75rem;
      border: 1px solid #b45309;
      border-radius: 6px;
      background: #fff;
      color: #b45309;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .select-all-row button:hover {
      background: #b45309;
      color: #fff;
    }
    .song-check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .song-check-row input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }
    .song-check-row .check-tiv {
      font-weight: 600;
      color: #b45309;
      min-width: 3rem;
      font-size: 0.9rem;
    }
    .song-check-row .check-title {
      flex: 1;
      overflow-wrap: anywhere;
    }
    .song-check-row .check-title-en {
      color: #666;
      font-size: 0.85rem;
    }
    .selection-modal-footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      padding: 1rem 1.5rem;
      background: #fff;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .selection-modal-footer-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .selection-modal-footer .count {
      color: #888;
      font-size: 0.9rem;
    }
    .selection-modal-footer .actions {
      display: flex;
      gap: 0.5rem;
    }
    .selection-modal-footer .actions button {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .selection-modal-footer .share-section-inner {
      width: 100%;
      border-top: 1px solid #eee;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
    }
    .share-link-box {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .share-link-box input {
      flex: 1;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .share-link-box button {
      padding: 0.4rem 0.75rem;
      background: #b45309;
      color: #fff;
      border: 1px solid #b45309;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
     .share-link-box button:hover { background: #9a3412; }
     .share-link-box #go-list {
       background: #4caf50;
       border-color: #4caf50;
       color: #fff;
     }
     .share-link-box #go-list:hover { background: #388e3c; }
  </style>
  <script src="data/thiruppugazh.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <div class="header-row">
    <a href="/" class="home-link">Home</a>
    <button type="button" id="open-selection" class="create-list-btn">+ Create Bhajan List</button>
  </div>
  <h1>Bhajan Lists</h1>
  <div id="lists-container"></div>
  <div class="header-row-bottom">
    <span id="list-count" style="color:#888; font-size:0.9rem;"></span>
    <button class="btn-clear-all" id="clear-all">Clear All</button>
  </div>

  <div class="selection-overlay hidden" id="selection-overlay" role="dialog" aria-modal="true" aria-labelledby="selection-title">
    <div class="selection-modal">
      <div class="selection-modal-header">
        <div class="selection-modal-header-name">
          <label for="list-name-input">List Name:</label>
          <input type="text" id="list-name-input" placeholder="e.g. Morning Prayers">
        </div>
        <button class="close" id="selection-close" aria-label="Close">×</button>
      </div>
      <div class="selection-modal-body">
        <h2 id="selection-title">Select Songs</h2>
        <div class="select-all-row">
          <button type="button" id="select-all">Select All</button>
          <button type="button" id="deselect-all">Deselect All</button>
        </div>
        <div id="selection-list"></div>
      </div>
      <div class="selection-modal-footer" id="selection-modal-footer">
        <span class="meta" id="selection-meta"></span>
        <div class="selection-modal-footer-actions">
          <span class="count" id="selection-count">0 songs selected</span>
          <div class="actions">
            <button class="btn-cancel" id="selection-cancel">Cancel</button>
            <button class="btn-generate" id="selection-generate">Generate Link</button>
          </div>
        </div>
        <div class="share-section-inner" id="share-section" style="display:none;">
          <strong>Share:</strong>
          <div class="share-link-box">
            <input type="text" id="share-url" readonly>
            <button type="button" id="copy-link">Copy</button>
            <button type="button" id="go-list">Go to Bhajan List</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      function renderLists() {
        const container = document.getElementById("lists-container");
        const countEl = document.getElementById("list-count");
        const lists = BhajanLists.get();
        container.textContent = "";
        countEl.textContent = lists.length + " list(s)";

        if (lists.length === 0) {
          container.innerHTML = '<p class="empty-state">No bhajan lists yet. Create one with the button above, or browse the <a href="/">home page</a>.</p>';
          return;
        }

        lists.sort(function(a, b) { return b.date - a.date; });
        for (const list of lists) {
          const card = document.createElement("div");
          card.className = "list-card";

          const left = document.createElement("div");
          const title = document.createElement("a");
          title.className = "list-card-title";
          title.href = list.url;
          title.textContent = list.name || "Untitled List";
          title.addEventListener("click", function() {
            // Increment count on visit
            BhajanLists.recordVisit(list.url);
            countEl.textContent = BhajanLists.get().length + " list(s)";
          });
          const meta = document.createElement("div");
          meta.className = "list-card-meta";
          meta.textContent = "Visited " + (list.count || 0) + " time(s)";
          left.append(title, meta);

          const actions = document.createElement("div");
          actions.className = "list-card-actions";
          const countBadge = document.createElement("span");
          countBadge.className = "list-card-count";
          countBadge.textContent = (list.count || 0) + " visits";
          const delBtn = document.createElement("button");
          delBtn.className = "btn-delete";
          delBtn.textContent = "Remove";
          delBtn.addEventListener("click", function() {
            const idx = lists.indexOf(list);
            if (idx >= 0) {
              lists.splice(idx, 1);
              BhajanLists.save(lists);
              renderLists();
            }
          });
          actions.append(countBadge, delBtn);

          card.append(left, actions);
          container.appendChild(card);
        }
      }

      document.getElementById("clear-all").addEventListener("click", function() {
        if (confirm("Clear all bhajan lists?")) {
          BhajanLists.clear();
          renderLists();
        }
      });

      renderLists();

      // --- create bhajan list (selection modal) ---
      const selectionOverlay = document.getElementById("selection-overlay");
      const selectionList = document.getElementById("selection-list");
      const selectionCount = document.getElementById("selection-count");
      const selectionMeta = document.getElementById("selection-meta");
      const shareSection = document.getElementById("share-section");
      const shareUrl = document.getElementById("share-url");
      const listNameInput = document.getElementById("list-name-input");
      let songs = [];
      let byTiv = [];
      let selectedTivs = new Set();

      function openSelection() {
        selectedTivs.clear();
        listNameInput.value = "";
        shareSection.style.display = "none";
        renderSelectionList();
        selectionOverlay.classList.remove("hidden");
        document.body.style.overflow = "hidden";
      }

      function closeSelection() {
        selectionOverlay.classList.add("hidden");
        document.body.style.overflow = "";
      }

      function renderSelectionList() {
        selectionList.textContent = "";
        let checkedCount = 0;
        for (const s of byTiv) {
          const tivStr = String(s.tiv).padStart(3, "0");
          const row = document.createElement("div");
          row.className = "song-check-row";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = selectedTivs.has(tivStr);
          cb.addEventListener("change", () => {
            if (cb.checked) selectedTivs.add(tivStr);
            else selectedTivs.delete(tivStr);
            updateCount();
          });
          const tivSpan = document.createElement("span");
          tivSpan.className = "check-tiv";
          tivSpan.textContent = tivStr;
          const titleSpan = document.createElement("span");
          titleSpan.className = "check-title";
          titleSpan.textContent = s.title;
          const titleEnSpan = document.createElement("span");
          titleEnSpan.className = "check-title-en";
          titleEnSpan.textContent = " — " + s.title_en;
          titleSpan.appendChild(titleEnSpan);
          row.append(cb, tivSpan, titleSpan);
          selectionList.appendChild(row);
          if (cb.checked) checkedCount++;
        }
        selectionMeta.textContent = checkedCount + " of " + songs.length + " song(s) selected";
      }

      function updateCount() {
        selectionCount.textContent = selectedTivs.size + " song(s) selected";
      }

      function generateLink() {
        const tivArray = Array.from(selectedTivs).sort();
        const nameVal = listNameInput.value.trim();
        const params = new URLSearchParams();
        if (tivArray.length > 0) params.set("tivs", tivArray.join(","));
        if (nameVal) params.set("name", nameVal);
        const link = BhajanLists.catalogUrl(params.toString());
        shareUrl.value = link;
        shareSection.style.display = "";
        window.history.replaceState({}, "", link);
        try {
          if (nameVal) BhajanLists.recordVisit(link, nameVal);
        } catch(e) {}
      }

      document.getElementById("open-selection").addEventListener("click", openSelection);
      document.getElementById("selection-close").addEventListener("click", closeSelection);
      document.getElementById("selection-cancel").addEventListener("click", closeSelection);
      selectionOverlay.addEventListener("click", (e) => {
        if (e.target === selectionOverlay) closeSelection();
      });
      document.getElementById("select-all").addEventListener("click", () => {
        for (const s of byTiv) selectedTivs.add(String(s.tiv).padStart(3, "0"));
        renderSelectionList();
        updateCount();
      });
      document.getElementById("deselect-all").addEventListener("click", () => {
        selectedTivs.clear();
        renderSelectionList();
        updateCount();
      });
      document.getElementById("selection-generate").addEventListener("click", generateLink);
      document.getElementById("copy-link").addEventListener("click", () => {
        shareUrl.select();
        navigator.clipboard.writeText(shareUrl.value).catch(() => {
          document.execCommand("copy");
        });
      });
      document.getElementById("go-list").addEventListener("click", () => {
        window.location.href = shareUrl.value;
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !selectionOverlay.classList.contains("hidden")) closeSelection();
      });

      Thiruppugazh.load().then((data) => {
        songs = data.songs;
        byTiv = data.byTiv;
        if (!selectionOverlay.classList.contains("hidden")) {
          renderSelectionList();
          updateCount();
        }
      }).catch(() => {});
    })();
  </script>
</body>
</html>

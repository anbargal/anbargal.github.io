<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pushparatheeshwarar Temple - Mindmap</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1a1a2e;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2em;
        }
        .mindmap {
            position: relative;
            width: 100%;
            height: 900px;
            background: #16213e;
            border-radius: 12px;
            border: 2px solid #0f3460;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        .line {
            stroke: #e94560;
            stroke-width: 2;
            fill: none;
            opacity: 0.7;
        }
        .circle {
            stroke-width: 3;
            cursor: pointer;
        }
        .center {
            fill: #e94560;
            stroke: #ff6b6b;
        }
        .c1 { fill: #4a90e2; stroke: #357abd; }
        .c2 { fill: #50c878; stroke: #3cb371; }
        .c3 { fill: #ffb347; stroke: #ff8c42; }
        .c4 { fill: #da70d6; stroke: #ba55d3; }
        .c5 { fill: #20b2aa; stroke: #008b8b; }
        .c6 { fill: #f08080; stroke: #cd5c5c; }
        .text {
            fill: white;
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        .text-small {
            font-size: 9px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pushparatheeshwarar Temple, Ponneri</h1>
        <div class="mindmap">
            <svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
                <!-- Lines from center -->
                <line class="line" x1="600" y1="450" x2="350" y2="200" />
                <line class="line" x1="600" y1="450" x2="850" y2="200" />
                <line class="line" x1="600" y1="450" x2="250" y2="450" />
                <line class="line" x1="600" y1="450" x2="950" y2="450" />
                <line class="line" x1="600" y1="450" x2="350" y2="700" />
                <line class="line" x1="600" y1="450" x2="850" y2="700" />
                
                <!-- Center -->
                <g>
                    <circle class="circle center" cx="600" cy="450" r="70" />
                    <text class="text" x="600" y="450">
                        <tspan x="600" dy="-6">TEMPLE</tspan>
                        <tspan x="600" dy="14">ROOT</tspan>
                    </text>
                </g>
                
                <!-- Temple Name -->
                <g>
                    <circle class="circle c1" cx="350" cy="200" r="55" />
                    <text class="text text-small" x="350" y="200">
                        <tspan x="350" dy="-10">Temple Name</tspan>
                        <tspan x="350" dy="12">Pushparatheeshwarar</tspan>
                        <tspan x="350" dy="12">Temple</tspan>
                    </text>
                </g>
                
                <!-- Location -->
                <g>
                    <circle class="circle c2" cx="850" cy="200" r="50" />
                    <text class="text text-small" x="850" y="200">
                        <tspan x="850" dy="-6">Location</tspan>
                        <tspan x="850" dy="14">Ponneri</tspan>
                    </text>
                </g>
                
                <!-- Aka -->
                <g>
                    <circle class="circle c3" cx="250" cy="450" r="50" />
                    <text class="text text-small" x="250" y="450">
                        <tspan x="250" dy="-6">Also Known As</tspan>
                        <tspan x="250" dy="14">Gnayiru Temple</tspan>
                    </text>
                </g>
                
                <!-- Consort -->
                <g>
                    <circle class="circle c4" cx="950" cy="450" r="50" />
                    <text class="text text-small" x="950" y="450">
                        <tspan x="950" dy="-6">Consort</tspan>
                        <tspan x="950" dy="14">Swarnambikai</tspan>
                    </text>
                </g>
                
                <!-- Story 1 -->
                <g>
                    <circle class="circle c5" cx="350" cy="700" r="65" />
                    <text class="text text-small" x="350" y="700">
                        <tspan x="350" dy="-18">Story 1</tspan>
                        <tspan x="350" dy="12">Surya lost radiance</tspan>
                        <tspan x="350" dy="12">due to mistake in</tspan>
                        <tspan x="350" dy="12">Brahma's yaga</tspan>
                        <tspan x="350" dy="12">& worshipped here</tspan>
                    </text>
                </g>
                
                <!-- Story 2 -->
                <g>
                    <circle class="circle c6" cx="850" cy="700" r="65" />
                    <text class="text text-small" x="850" y="700">
                        <tspan x="850" dy="-12">Story 2</tspan>
                        <tspan x="850" dy="14">Birthplace of</tspan>
                        <tspan x="850" dy="14">Sengili Nachiyar</tspan>
                        <tspan x="850" dy="14">(wife of Sundarar)</tspan>
                    </text>
                </g>
            </svg>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muruga Sharanam</title>
  <meta name="description" content="Muruga Sharanam landing page">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0 auto;
      max-width: 46rem;
      padding: 1.5rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 0.25rem; }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bhajan-link {
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: #b45309;
      border: 1px solid #b45309;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      white-space: nowrap;
    }
    .bhajan-link:hover {
      background: #b45309;
      color: #fff;
    }
    #status { color: #777; }
    #search {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #search:focus {
      outline: none;
      border-color: #b45309;
      box-shadow: 0 0 0 2px rgba(180, 83, 9, 0.15);
    }
    table.songs {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.songs th {
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      padding: 0 0.5rem 0.25rem;
      border-bottom: 1px solid #e5e5e5;
    }
    table.songs th:nth-child(1) { width: 3.25rem; }
    table.songs th:nth-child(3) { width: 3.25rem; }
    table.songs td {
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }
    table.songs tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
    td.tiv {
      font-weight: 600;
      color: #b45309;
    }
    td.title-cell {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    td.yt-cell {
      width: 3.25rem;
      text-align: center;
    }
    .title { font-weight: 600; cursor: pointer; }
    .title:hover { text-decoration: underline; }
    .title-en { color: #666; }
    .meta { color: #888; font-size: 0.9rem; margin-top: 0.15rem; }
    .yt-link { display: inline-block; }
    .yt-link svg {
      display: block;
      width: 24px;
      height: 24px;
    }
    .yt-link:focus-visible {
      outline: 2px solid #b45309;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 42rem;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      border-bottom: 1px solid #eee;
      padding: 1rem 1.5rem;
    }
    .modal-header h2 { margin: 0; font-size: 1.2rem; }
    .close {
      border: none;
      background: #f0f0f0;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .close:hover { background: #e0e0e0; }
    .modal-body { padding: 1rem 1.5rem 2rem; }
    .modal-body h3 {
      margin: 1.25rem 0 0.5rem;
      color: #b45309;
      font-size: 1rem;
    }
      .modal-body p { margin: 0 0 0.25rem; }
      .charanam { margin-top: 1.25rem; }
      .create-list-btn {
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        background: #b45309;
        border: 1px solid #b45309;
        border-radius: 6px;
        padding: 0.35rem 0.75rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .create-list-btn:hover {
        background: #9a3412;
        color: #fff;
      }
      .selection-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
    }
    .selection-overlay.hidden { display: none; }
    .selection-modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 42rem;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .selection-modal-header {
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #eee;
      padding: 1rem 1.5rem;
    }
    .selection-modal-header h2 { margin: 0; font-size: 1.2rem; }
    .selection-modal-body { padding: 1rem 1.5rem 2rem; }
    .select-all-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .select-all-row button {
      padding: 0.4rem 0.75rem;
      border: 1px solid #b45309;
      border-radius: 6px;
      background: #fff;
      color: #b45309;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .select-all-row button:hover {
      background: #b45309;
      color: #fff;
    }
    .song-check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .song-check-row input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }
    .song-check-row .check-tiv {
      font-weight: 600;
      color: #b45309;
      min-width: 3rem;
      font-size: 0.9rem;
    }
    .song-check-row .check-title {
      flex: 1;
      overflow-wrap: anywhere;
    }
    .song-check-row .check-title-en {
      color: #666;
      font-size: 0.85rem;
    }
    .selection-modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      padding: 1rem 1.5rem;
      position: sticky;
      bottom: 0;
      background: #fff;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .selection-modal-footer .count {
      color: #888;
      font-size: 0.9rem;
    }
    .selection-modal-footer .actions {
      display: flex;
      gap: 0.5rem;
    }
    .selection-modal-footer .actions button {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .selection-modal-footer .share-section-inner {
      width: 100%;
      border-top: 1px solid #eee;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
    }
    .share-link-box {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .share-link-box input {
      flex: 1;
      padding: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .share-link-box button {
      padding: 0.4rem 0.75rem;
      background: #b45309;
      color: #fff;
      border: 1px solid #b45309;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
     .share-link-box button:hover { background: #9a3412; }
     .share-link-box #go-list {
       background: #4caf50;
       border-color: #4caf50;
       color: #fff;
     }
     .share-link-box #go-list:hover { background: #388e3c; }
     .filter-badge {
      display: inline-block;
      background: #b45309;
      color: #fff;
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
      margin-left: 0.5rem;
      cursor: pointer;
    }
    .filter-badge:hover { background: #9a3412; }
  </style>
</head>
<body>
   <div class="header-row">
     <h1>Muruga Sharanam</h1>
      <a href="bhajan-lists.html" class="bhajan-link">Bhajan Lists</a>
      <button id="open-selection" class="create-list-btn">+ Create Bhajan List</button>
    </div>
  <input type="search" id="search" placeholder="தேடுக / Search…" aria-label="Search songs" autocomplete="off">
  <p id="status">Loading songs…</p>
  <div id="list-name-display" style="display:none; font-size:1.5rem; font-weight:700; color:#b45309; margin-bottom:0.5rem;"></div>
  <table class="songs">
    <thead>
      <tr>
        <th scope="col">TIV</th>
        <th scope="col">பாடல்</th>
        <th scope="col"><span class="visually-hidden">YouTube</span></th>
      </tr>
    </thead>
    <tbody id="songs"></tbody>
  </table>

  <div class="selection-overlay hidden" id="selection-overlay" role="dialog" aria-modal="true" aria-labelledby="selection-title">
    <div class="selection-modal">
   <div class="selection-modal-header">
     <div>
       <div class="meta" id="selection-meta"></div>
     </div>
     <button class="close" id="selection-close" aria-label="Close">×</button>
   </div>
      <div class="selection-modal-body">
        <h2 id="selection-title">Select Songs</h2>
        <div style="margin-bottom:0.75rem;">
          <label for="list-name-input" style="font-weight:600; font-size:0.9rem;">List Name:</label>
          <input type="text" id="list-name-input" placeholder="e.g. Morning Prayers" style="width:100%; padding:0.4rem 0.6rem; border:1px solid #ccc; border-radius:6px; font-size:0.9rem; margin-top:0.25rem; box-sizing:border-box;">
        </div>
        <input type="search" id="selection-search" placeholder="Search songs…" aria-label="Search songs" style="width:100%; padding:0.4rem 0.6rem; border:1px solid #ccc; border-radius:6px; font-size:0.9rem; margin-bottom:0.5rem; box-sizing:border-box;">
        <div class="select-all-row">
          <button type="button" id="select-all">Select All</button>
          <button type="button" id="deselect-all">Deselect All</button>
        </div>
        <div id="selection-list"></div>
      </div>
      <div class="selection-modal-footer" id="selection-modal-footer">
        <span class="count" id="selection-count">0 songs selected</span>
        <div class="actions">
          <button class="btn-cancel" id="selection-cancel">Cancel</button>
          <button class="btn-generate" id="selection-generate">Generate Link</button>
        </div>
        <div class="share-section-inner" id="share-section" style="display:none;">
          <strong>Share:</strong>
          <div class="share-link-box">
            <input type="text" id="share-url" readonly>
            <button type="button" id="copy-link">Copy</button>
             <button type="button" id="go-list">Go to Bhajan List</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="overlay-title" lang="ta"></h2>
          <div class="meta" id="overlay-meta"></div>
        </div>
        <button class="close" id="overlay-close" aria-label="மூடு / Close">×</button>
      </div>
      <div class="modal-body" id="overlay-lyrics"></div>
    </div>
  </div>

  <script>
    (async () => {
      const status = document.getElementById("status");
      const tbody = document.getElementById("songs");
      const search = document.getElementById("search");
       let songs = [];
       let currentShown = [];
       let byTiv = [];
       let selectedTivs = new Set();
       let urlTivs = new Set();
       let listName = "";
       const listNameDisplay = document.getElementById("list-name-display");
       try {
         const params = new URLSearchParams(window.location.search);
         const tivParam = params.get("tivs");
         const nameParam = params.get("name");
         if (tivParam) {
           urlTivs = new Set(tivParam.split(",").map(t => t.trim()));
         }
         if (nameParam) {
           listName = decodeURIComponent(nameParam);
           const url = window.location.href;
           try {
             const lists = JSON.parse(localStorage.getItem("bhajan_lists") || "[]");
             const existing = lists.findIndex(l => l.url === url);
             if (existing >= 0) {
               lists[existing].count = (lists[existing].count || 1) + 1;
             } else {
               lists.push({ name: listName, url, count: 1, date: Date.now() });
             }
             localStorage.setItem("bhajan_lists", JSON.stringify(lists));
           } catch(e) {}
         }
       } catch(e) {}
       try {
        const res = await fetch("data/thiruppugazh.jsonl");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        songs = text.trim().split("\n").filter(Boolean).map(JSON.parse);
        byTiv = songs.slice().sort((a, b) => a.tiv - b.tiv);
        search.addEventListener("input", () => render(filterSongs(search.value.trim())));
        render(byTiv);
      } catch (err) {
        status.textContent = "Failed to load songs: " + err.message;
      }

      function searchTexts(s) {
        const texts = [
          { text: String(s.tiv), boost: true },
          { text: String(s.kaumaram), boost: false },
        ];
        if (s.title) texts.push({ text: s.title, boost: true });
        if (s.title_en) texts.push({ text: s.title_en, boost: true });
        if (s.ragam) texts.push({ text: s.ragam, boost: false });
        if (s.kshetram) texts.push({ text: s.kshetram, boost: false });
        if (s.youtube) for (const u of s.youtube) texts.push({ text: u, boost: false });
        if (s.stanzas) {
          for (const line of s.stanzas.santham || []) texts.push({ text: line, boost: false });
          for (const ch of s.stanzas.charanams || []) for (const line of ch) texts.push({ text: line, boost: false });
        }
        return texts;
      }

      function fuzzyScore(query, target) {
        query = query.toLowerCase();
        target = target.toLowerCase();
        let q = 0, score = 0, consecutive = 0, prev = -2;
        for (let t = 0; t < target.length && q < query.length; t++) {
          if (target[t] === query[q]) {
            let bonus = 0;
            if (t === 0) bonus = 5;
            else if (/\s/.test(target[t - 1])) bonus = 3;
            if (t === prev + 1) { consecutive++; bonus += 5 * consecutive; }
            else consecutive = 1;
            score += 1 + bonus;
            prev = t;
            q++;
          }
        }
        return q === query.length ? score : -1;
      }

      function filterSongs(query) {
        if (!query) return byTiv;
        const scored = [];
        for (const s of songs) {
          let best = -1;
          for (const t of searchTexts(s)) {
            const sc = fuzzyScore(query, t.text) * (t.boost ? 2 : 1);
            if (sc > best) best = sc;
          }
          if (best >= 0) scored.push({ s, best });
        }
        scored.sort((a, b) => b.best - a.best);
        return scored.map(x => x.s);
      }

      function filterByUrlTivs(list) {
        if (urlTivs.size === 0) return list;
        return list.filter(s => urlTivs.has(String(s.tiv).padStart(3, "0")));
      }

      function render(shown) {
        currentShown = shown;
        const filtered = filterByUrlTivs(shown);
        status.textContent = filtered.length === songs.length
          ? songs.length + " song(s)"
          : filtered.length + " of " + songs.length + " song(s)";
        if (urlTivs.size > 0) {
           status.innerHTML += ' <span class="filter-badge" id="clear-filter">× Clear filter</span>';
           const clearBtn = document.getElementById("clear-filter");
            if (clearBtn) clearBtn.addEventListener("click", () => {
              urlTivs.clear();
              listName = "";
              const url = new URL(window.location);
              url.searchParams.delete("tivs");
              url.searchParams.delete("name");
              window.history.replaceState({}, "", url);
              listNameDisplay.style.display = "none";
              render(currentShown);
            });
         }
         if (listName) {
           listNameDisplay.textContent = listName;
           listNameDisplay.style.display = "";
         } else {
           listNameDisplay.style.display = "none";
         }
        tbody.textContent = "";
        const frag = document.createDocumentFragment();
        for (const s of filtered) {
          const tr = document.createElement("tr");

          const tiv = document.createElement("td");
          tiv.className = "tiv";
          tiv.textContent = String(s.tiv).padStart(3, "0");

          const titleCell = document.createElement("td");
          titleCell.className = "title-cell";

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = s.title;
          title.lang = "ta";
          title.tabIndex = 0;
          title.setAttribute("role", "button");
          title.addEventListener("click", () => openOverlay(s));
          title.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openOverlay(s); }
          });

          const titleEn = document.createElement("span");
          titleEn.className = "title-en";
          titleEn.textContent = " — " + s.title_en;

          titleCell.append(title, titleEn);

          const meta = document.createElement("div");
          meta.className = "meta";
          const parts = [];
          if (s.ragam) parts.push("ராகம்: " + s.ragam);
          if (s.thalam) parts.push("தாளம்: " + s.thalam);
          if (s.kshetram) parts.push(s.kshetram);
          if (parts.length) meta.textContent = parts.join(" · ");
          if (parts.length) titleCell.appendChild(meta);

          const ytCell = document.createElement("td");
          ytCell.className = "yt-cell";
          if (s.youtube && s.youtube.length) {
            const a = document.createElement("a");
            a.className = "yt-link";
            a.href = s.youtube[0];
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.setAttribute("aria-label", "YouTube: " + (s.title || ""));
            a.title = "YouTube";
            a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
              + '<path fill="#FF0000" d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>';
            ytCell.appendChild(a);
          }

          tr.append(tiv, titleCell, ytCell);
          frag.appendChild(tr);
        }
        tbody.appendChild(frag);
      }

      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMeta = document.getElementById("overlay-meta");
      const overlayLyrics = document.getElementById("overlay-lyrics");
      const overlayClose = document.getElementById("overlay-close");
      const selectionOverlay = document.getElementById("selection-overlay");
       const selectionList = document.getElementById("selection-list");
       const selectionCount = document.getElementById("selection-count");
       const selectionMeta = document.getElementById("selection-meta");
       const shareSection = document.getElementById("share-section");
       const shareUrl = document.getElementById("share-url");
       const listNameInput = document.getElementById("list-name-input");
       const selectionSearch = document.getElementById("selection-search");
       const selectionTitleEl = document.getElementById("selection-title");

       function openSelection() {
         selectedTivs.clear();
         listName = "";
         listNameInput.value = "";
         shareSection.style.display = "none";
         renderSelectionList();
         selectionOverlay.classList.remove("hidden");
         document.body.style.overflow = "hidden";
       }

       function closeSelection() {
        selectionOverlay.classList.add("hidden");
        document.body.style.overflow = "";
      }

       function renderSelectionList() {
         const searchEl = document.getElementById("selection-search");
         const query = searchEl ? searchEl.value.toLowerCase().trim() : "";
         selectionList.textContent = "";
         let checkedCount = 0;
         const filteredSongs = query ? byTiv.filter(s =>
           s.title.toLowerCase().includes(query) ||
           (s.title_en && s.title_en.toLowerCase().includes(query)) ||
           (s.ragam && s.ragam.toLowerCase().includes(query)) ||
           String(s.tiv).includes(query)
         ) : byTiv;
         for (const s of filteredSongs) {
          const tivStr = String(s.tiv).padStart(3, "0");
          const row = document.createElement("div");
          row.className = "song-check-row";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = selectedTivs.has(tivStr);
          cb.addEventListener("change", () => {
            if (cb.checked) selectedTivs.add(tivStr);
            else selectedTivs.delete(tivStr);
            updateCount();
          });
          const tivSpan = document.createElement("span");
          tivSpan.className = "check-tiv";
          tivSpan.textContent = tivStr;
          const titleSpan = document.createElement("span");
          titleSpan.className = "check-title";
          titleSpan.textContent = s.title;
          const titleEnSpan = document.createElement("span");
          titleEnSpan.className = "check-title-en";
          titleEnSpan.textContent = " — " + s.title_en;
          titleSpan.appendChild(titleEnSpan);
          row.append(cb, tivSpan, titleSpan);
          selectionList.appendChild(row);
          if (cb.checked) checkedCount++;
        }
        selectionMeta.textContent = checkedCount + " of " + songs.length + " song(s) selected";
      }

      function updateCount() {
        selectionCount.textContent = selectedTivs.size + " song(s) selected";
      }

      function generateLink() {
        const tivArray = Array.from(selectedTivs).sort();
        const nameVal = listNameInput.value.trim();
        const url = new URL(window.location);
        if (tivArray.length > 0) {
          url.searchParams.set("tivs", tivArray.join(","));
        } else {
          url.searchParams.delete("tivs");
        }
        if (nameVal) {
          listName = nameVal;
          url.searchParams.set("name", encodeURIComponent(nameVal));
        } else {
          url.searchParams.delete("name");
          listName = "";
        }
         const link = url.toString();
         shareUrl.value = link;
         shareSection.style.display = "";
         window.history.replaceState({}, "", link);
         try {
           const lists = JSON.parse(localStorage.getItem("bhajan_lists") || "[]");
           if (nameVal) {
             const existing = lists.findIndex(l => l.url === link);
             if (existing >= 0) {
               lists[existing].count = (lists[existing].count || 1) + 1;
             } else {
               lists.push({ name: nameVal, url: link, count: 1, date: Date.now() });
             }
             localStorage.setItem("bhajan_lists", JSON.stringify(lists));
           }
         } catch(e) {}
        }

       document.getElementById("selection-close").addEventListener("click", closeSelection);
       document.getElementById("selection-cancel").addEventListener("click", closeSelection);
       selectionOverlay.addEventListener("click", (e) => {
         if (e.target === selectionOverlay) closeSelection();
       });
       document.getElementById("open-selection").addEventListener("click", openSelection);
       document.getElementById("select-all").addEventListener("click", () => {
        for (const s of byTiv) selectedTivs.add(String(s.tiv).padStart(3, "0"));
        renderSelectionList();
      });
      document.getElementById("deselect-all").addEventListener("click", () => {
        selectedTivs.clear();
        renderSelectionList();
      });
       document.getElementById("selection-generate").addEventListener("click", generateLink);
       selectionSearch.addEventListener("input", renderSelectionList);
       document.getElementById("copy-link").addEventListener("click", () => {
         shareUrl.select();
         navigator.clipboard.writeText(shareUrl.value).catch(() => {
           document.execCommand("copy");
         });
       });
       document.getElementById("go-list").addEventListener("click", () => {
         window.location.href = shareUrl.value;
       });

       overlayClose.addEventListener("click", closeOverlay);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeOverlay();
      });
       document.addEventListener("keydown", (e) => {
         if (e.key === "Escape") {
           if (!selectionOverlay.classList.contains("hidden")) closeSelection();
           else if (!overlay.classList.contains("hidden")) closeOverlay();
         }
       });
       if (new URL(window.location.search).searchParams.get("create") === "true") {
         openSelection();
       }
     })();
  </script>
</body>
</html>

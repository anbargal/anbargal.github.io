<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muruga Sharanam</title>
  <meta name="description" content="Muruga Sharanam landing page">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0 auto;
      max-width: 46rem;
      padding: 1.5rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 0.25rem; }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bhajan-link {
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: #b45309;
      border: 1px solid #b45309;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      white-space: nowrap;
    }
    .bhajan-link:hover {
      background: #b45309;
      color: #fff;
    }
    #status { color: #777; }
    #search {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #search:focus {
      outline: none;
      border-color: #b45309;
      box-shadow: 0 0 0 2px rgba(180, 83, 9, 0.15);
    }
    table.songs {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.songs th {
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      padding: 0 0.5rem 0.25rem;
      border-bottom: 1px solid #e5e5e5;
    }
    table.songs th:nth-child(1) { width: 3.25rem; }
    table.songs th:nth-child(3) { width: 3.25rem; }
    table.songs td {
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }
    table.songs tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
    td.tiv {
      font-weight: 600;
      color: #b45309;
    }
    td.title-cell {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    td.yt-cell {
      width: 3.25rem;
      text-align: center;
    }
    .title { font-weight: 600; cursor: pointer; }
    .title:hover { text-decoration: underline; }
    .title-en { color: #666; }
    .meta { color: #888; font-size: 0.9rem; margin-top: 0.15rem; }
    .yt-link { display: inline-block; }
    .yt-link svg {
      display: block;
      width: 24px;
      height: 24px;
    }
    .yt-link:focus-visible {
      outline: 2px solid #b45309;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 42rem;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      position: sticky;
      top: 0;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      border-bottom: 1px solid #eee;
      padding: 1rem 1.5rem;
    }
    .modal-header h2 { margin: 0; font-size: 1.2rem; }
    .close {
      border: none;
      background: #f0f0f0;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .close:hover { background: #e0e0e0; }
    .modal-body { padding: 1rem 1.5rem 2rem; }
    .modal-body h3 {
      margin: 1.25rem 0 0.5rem;
      color: #b45309;
      font-size: 1rem;
    }
    .modal-body p { margin: 0 0 0.25rem; }
    .charanam { margin-top: 1.25rem; }
  </style>
</head>
<body>
  <div class="header-row">
    <h1>Muruga Sharanam</h1>
    <a href="bhajan-lists.html" class="bhajan-link">Bhajan Lists</a>
  </div>
  <input type="search" id="search" placeholder="தேடுக / Search…" aria-label="Search songs" autocomplete="off">
  <p id="status">Loading songs…</p>
  <table class="songs">
    <thead>
      <tr>
        <th scope="col">TIV</th>
        <th scope="col">பாடல்</th>
        <th scope="col"><span class="visually-hidden">YouTube</span></th>
      </tr>
    </thead>
    <tbody id="songs"></tbody>
  </table>

  <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="overlay-title" lang="ta"></h2>
          <div class="meta" id="overlay-meta"></div>
        </div>
        <button class="close" id="overlay-close" aria-label="மூடு / Close">×</button>
      </div>
      <div class="modal-body" id="overlay-lyrics"></div>
    </div>
  </div>

  <script>
    (async () => {
      const status = document.getElementById("status");
      const tbody = document.getElementById("songs");
      const search = document.getElementById("search");
      let songs = [];
      try {
        const res = await fetch("data/thiruppugazh.jsonl");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        songs = text.trim().split("\n").filter(Boolean).map(JSON.parse);
        const byTiv = songs.slice().sort((a, b) => a.tiv - b.tiv);
        search.addEventListener("input", () => render(filterSongs(search.value.trim())));
        render(byTiv);
      } catch (err) {
        status.textContent = "Failed to load songs: " + err.message;
      }

      function searchTexts(s) {
        const texts = [
          { text: String(s.tiv), boost: true },
          { text: String(s.kaumaram), boost: false },
        ];
        if (s.title) texts.push({ text: s.title, boost: true });
        if (s.title_en) texts.push({ text: s.title_en, boost: true });
        if (s.ragam) texts.push({ text: s.ragam, boost: false });
        if (s.kshetram) texts.push({ text: s.kshetram, boost: false });
        if (s.youtube) for (const u of s.youtube) texts.push({ text: u, boost: false });
        if (s.stanzas) {
          for (const line of s.stanzas.santham || []) texts.push({ text: line, boost: false });
          for (const ch of s.stanzas.charanams || []) for (const line of ch) texts.push({ text: line, boost: false });
        }
        return texts;
      }

      function fuzzyScore(query, target) {
        query = query.toLowerCase();
        target = target.toLowerCase();
        let q = 0, score = 0, consecutive = 0, prev = -2;
        for (let t = 0; t < target.length && q < query.length; t++) {
          if (target[t] === query[q]) {
            let bonus = 0;
            if (t === 0) bonus = 5;
            else if (/\s/.test(target[t - 1])) bonus = 3;
            if (t === prev + 1) { consecutive++; bonus += 5 * consecutive; }
            else consecutive = 1;
            score += 1 + bonus;
            prev = t;
            q++;
          }
        }
        return q === query.length ? score : -1;
      }

      function filterSongs(query) {
        if (!query) return byTiv;
        const scored = [];
        for (const s of songs) {
          let best = -1;
          for (const t of searchTexts(s)) {
            const sc = fuzzyScore(query, t.text) * (t.boost ? 2 : 1);
            if (sc > best) best = sc;
          }
          if (best >= 0) scored.push({ s, best });
        }
        scored.sort((a, b) => b.best - a.best);
        return scored.map(x => x.s);
      }

      function render(shown) {
        status.textContent = shown.length === songs.length
          ? songs.length + " song(s)"
          : shown.length + " of " + songs.length + " song(s)";
        tbody.textContent = "";
        const frag = document.createDocumentFragment();
        for (const s of shown) {
          const tr = document.createElement("tr");

          const tiv = document.createElement("td");
          tiv.className = "tiv";
          tiv.textContent = String(s.tiv).padStart(3, "0");

          const titleCell = document.createElement("td");
          titleCell.className = "title-cell";

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = s.title;
          title.lang = "ta";
          title.tabIndex = 0;
          title.setAttribute("role", "button");
          title.addEventListener("click", () => openOverlay(s));
          title.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openOverlay(s); }
          });

          const titleEn = document.createElement("span");
          titleEn.className = "title-en";
          titleEn.textContent = " — " + s.title_en;

          titleCell.append(title, titleEn);

          const meta = document.createElement("div");
          meta.className = "meta";
          const parts = [];
          if (s.ragam) parts.push("ராகம்: " + s.ragam);
          if (s.thalam) parts.push("தாளம்: " + s.thalam);
          if (s.kshetram) parts.push(s.kshetram);
          if (parts.length) meta.textContent = parts.join(" · ");
          if (parts.length) titleCell.appendChild(meta);

          const ytCell = document.createElement("td");
          ytCell.className = "yt-cell";
          if (s.youtube && s.youtube.length) {
            const a = document.createElement("a");
            a.className = "yt-link";
            a.href = s.youtube[0];
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.setAttribute("aria-label", "YouTube: " + (s.title || ""));
            a.title = "YouTube";
            a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
              + '<path fill="#FF0000" d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>';
            ytCell.appendChild(a);
          }

          tr.append(tiv, titleCell, ytCell);
          frag.appendChild(tr);
        }
        tbody.appendChild(frag);
      }

      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayMeta = document.getElementById("overlay-meta");
      const overlayLyrics = document.getElementById("overlay-lyrics");
      const overlayClose = document.getElementById("overlay-close");

      function openOverlay(s) {
        overlayTitle.textContent = s.title;
        const parts = [];
        if (s.ragam) parts.push("ராகம்: " + s.ragam);
        if (s.thalam) parts.push("தாளம்: " + s.thalam);
        if (s.kshetram) parts.push("க்ஷேத்திரம்: " + s.kshetram);
        overlayMeta.textContent = parts.join(" · ");

        overlayLyrics.textContent = "";
        if (s.stanzas) {
          if (s.stanzas.santham && s.stanzas.santham.length) {
            const h = document.createElement("h3");
            h.textContent = "சந்தம்";
            overlayLyrics.appendChild(h);
            for (const line of s.stanzas.santham) {
              const p = document.createElement("p");
              p.textContent = line;
              overlayLyrics.appendChild(p);
            }
          }
          if (s.stanzas.charanams && s.stanzas.charanams.length) {
            const h = document.createElement("h3");
            h.textContent = "பாடல்";
            overlayLyrics.appendChild(h);
            for (const ch of s.stanzas.charanams) {
              const div = document.createElement("div");
              div.className = "charanam";
              for (const line of ch) {
                const p = document.createElement("p");
                p.textContent = line;
                div.appendChild(p);
              }
              overlayLyrics.appendChild(div);
            }
          }
        }

        overlay.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        overlayClose.focus();
      }

      function closeOverlay() {
        overlay.classList.add("hidden");
        document.body.style.overflow = "";
      }

      overlayClose.addEventListener("click", closeOverlay);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeOverlay();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !overlay.classList.contains("hidden")) closeOverlay();
      });
    })();
  </script>
</body>
</html>
